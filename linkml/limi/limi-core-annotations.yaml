id: https://example.invalid/limi/v02-10/core/annotations
name: limi-core-annotations
title: LiMi Core Schema – Annotations
description: >-
  This schema is part of the set of LinkML schemas for the QUAREP Light
  Microscopy Model (hereafter referred to as “LiMi model”).

  It defines the classes for the generic annotation system, that the model
  inherited from the OME model.
notes:
  - This schema is not intended to be used on its own. Use limi-core instead.
created_by: orcid:0000-0002-6095-8718

prefixes:
  limi: https://example.invalid/limi/v02-10/
  orcid: https://orcid.org/
default_prefix: limi
default_range: string

classes:
  LiMiAnnotation:
    description: The base class for all annotations.
    slots:
      - id
      - object_type
    attributes:
      namespace:
        description: A namespace assigned to the annotation.
        recommended: true
        range: uri
      annotator:
        description: The person who attached this annotation.
        range: LiMiExperimenter
        inlined: false
      description:
        description: A description of the annotation.
      annotations:
        description: Annotations carried by this annotation.
        range: LiMiAnnotation
        multivalued: true
        inlined: false

  LiMiCommentAnnotation:
    description: A simple comment annotation.
    is_a: LiMiAnnotation
    attributes:
      value:
        description: The comment that makes up the annotation.
        required: true

  LiMiMapAnnotation:
    description: An annotation that is a list of key/value pairs.
    is_a: LiMiAnnotation
    attributes:
      value:
        description: The list of key/value pairs.
        range: LiMiMapEntry
        multivalued: true
        inlined: true
        inlined_as_list: false

  LiMiFileAnnotation:
    description: An annotation represented by an arbitrary file.
    notes:
      - FIXME The original OME model mandates that both `external` and
        `bin_data` must be present, which seems odd to me. I believe it should
        be "one of the two at least" must be present?
    is_a: LiMiAnnotation
    attributes:
      filename:
        description: The name of the file.
        required: true
      size:
        description: Size of the uncompressed file, in bytes.
        range: integer
        minimum_value: 0
        required: true
      mime_type:
        description: The MIME type of the file.
      external:
        description: A reference to a remote location
        range: LiMiExternalFileReference
      bin_data:
        description: The contents of the file.
        range: LiMiBase64Binary

  LiMiExternalFileReference:
    description: A reference to a file stored externally.
    is_a: LiMiObject
    attributes:
      href:
        description: The remote location of the file
        range: uri
        required: true
      sha1:
        description: The SHA1 digest of the remote file.
        notes:
          - FIXME We should migrate that to a more modern hash and/or allow
            different hash algorithms instead of hardcoding one.
        required: true
        range: LiMiHexBinary
      compression:
        description: The compression scheme used to encode the remote data.
        range: LiMiCompression
